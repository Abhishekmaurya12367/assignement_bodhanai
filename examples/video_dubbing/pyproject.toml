[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-dub"
version = "0.1.0"
description = "Agentic English-video to Indian-language dubbing pipeline using Bodhan models only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bodhan AI Cookbook contributor" }]
dependencies = [
  "openai==1.59.8",
  "httpx==0.28.1",
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "PyYAML==6.0.2",
  "rapidfuzz==3.11.0",
  "tenacity==9.0.0",
  "rich==13.9.4",
  "python-dotenv==1.0.1",
  # Phase 2+ (VAD / audio): numpy, soundfile, torch, torchaudio, silero-vad
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.2",
  "mypy==1.14.1",
  "types-PyYAML==6.0.12.20241230",
  "types-requests==2.32.0.20241016",
]

[project.scripts]
bodhan-dub = "bodhan_dub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["bodhan_dub"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
  "silero_vad.*",
  "torchaudio.*",
  "soundfile.*",
  "torch.*",
]
ignore_missing_imports = true
